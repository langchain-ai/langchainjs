name: Refresh Model Profiles

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Comma-separated models.dev provider IDs, or all"
        type: string
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: refresh-model-profiles
  cancel-in-progress: false

jobs:
  refresh-profiles:
    if: github.repository == 'langchain-ai/langchainjs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Refresh profiles
        env:
          PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || 'all' }}
        run: pnpm --filter @langchain/model-profiles refresh --provider "$PROVIDER"

      - name: Build pull request body
        id: body
        run: |
          body_file="${RUNNER_TEMP}/model-profiles-pr.md"
          {
            printf '%s\n\n' 'Automated refresh of model capabilities from [models.dev](https://models.dev), preserving provider and model overrides in profiles.toml.'
            printf '%s\n\n' 'Generated by the [model profile refresh workflow](https://github.com/langchain-ai/langchainjs/blob/main/.github/workflows/refresh-model-profiles.yml).'
            printf '%s\n' '```text'
            git diff --stat -- 'libs/providers/**/profiles.ts'
            printf '%s\n' '```'
          } > "$body_file"
          echo "path=$body_file" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.MODEL_PROFILE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MODEL_PROFILE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/refresh-model-profiles
          commit-message: "chore(internal): refresh model profile data"
          title: "chore(internal): refresh model profile data"
          body-path: ${{ steps.body.outputs.path }}
          add-paths: libs/providers/**/profiles.ts

      - name: Summary
        if: always()
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$PR_URL" ]; then
            printf 'Model profile pull request: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$JOB_STATUS" = 'success' ]; then
            printf 'Model profiles are already up to date.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Model profile refresh failed; no pull request was published.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
